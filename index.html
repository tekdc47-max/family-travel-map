  <main class="app">
    <aside class="rail" aria-label="旅行地点">
      <div class="brand"><div class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M12 21s7-5.6 7-12A7 7 0 1 0 5 9c0 6.4 7 12 7 12Z" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="9" r="2.5" fill="currentColor"/></svg></div><div><h1>我们的旅行地图</h1><p>把一起走过的路，留在这里</p></div></div>
      <div class="search-wrap"><span class="search-icon" aria-hidden="true">⌕</span><input id="search" class="search" placeholder="搜索城市或地区" autocomplete="off" aria-label="搜索城市或地区"><div id="searchResults" class="search-results" role="listbox"></div></div>
      <div class="section-head"><h2>旅行足迹</h2><span id="placeCount" class="count">0 个地点</span></div>
      <div id="placeList" class="place-list"><div class="empty-list">还没有旅行足迹。<br>搜索一座城市，或在地图上点一下，收藏你们一起去过的地方。</div></div>
      <div class="rail-foot">旅行记录保存在当前浏览器<br>刷新不丢失 · 暂不跨设备同步。</div>
    </aside>
    <section class="map-shell" aria-label="世界旅行地图"><div id="map" class="map"></div>
      <div class="map-top"><div class="map-caption"><b>一家人的世界足迹</b><span id="mapCaption">每一枚标记，都是一段共同回忆</span></div><div class="map-actions"><button id="locateBtn" class="icon-btn" title="回到世界地图" aria-label="回到世界地图">◎</button><button id="addBtn" class="pill-btn primary"><span aria-hidden="true">＋</span> 添加地点</button></div></div>
      <div class="map-hint">点地区平滑放大 · 点“添加地点”记录旅程</div>
    </section>
    <aside id="detailPanel" class="panel" aria-label="地点详情" aria-hidden="true"><div class="panel-head"><div><div class="eyebrow">FAMILY TRIP</div><h2 id="panelTitle">新地点</h2></div><button id="closePanel" class="panel-close" aria-label="关闭详情">×</button></div><div class="panel-body">
      <div class="field"><label for="placeName">地点名称</label><input id="placeName" maxlength="80" placeholder="例如：京都"></div>
      <div class="field"><label for="placeDate">旅行日期</label><input id="placeDate" type="date"></div>
      <div class="field"><label for="placeIntro">地区简介</label><textarea id="placeIntro" maxlength="400" placeholder="这座城市有什么特别之处？"></textarea></div>
      <div class="field"><label for="placeMemory">旅行回忆</label><textarea id="placeMemory" class="story" maxlength="3000" placeholder="写下那天的小事、喜欢的风景，或一句只有家人懂的话…"></textarea></div>
      <div class="field"><div class="photo-head">旅行照片 <span id="photoCount">0 张</span></div><div id="photoGrid" class="photo-grid"></div><input id="photoInput" type="file" accept="image/*" multiple hidden></div>
      <div class="panel-actions"><button id="savePlace" class="save-btn">保存地点</button><button id="deletePlace" class="delete-btn">删除</button></div>
    </div></aside>
  </main>
