<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:#2b4941;background:#f6f8f2;font-synthesis:none;--green:#277d69;--muted:#829088;--gold:#f4c859}*{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit}button{cursor:pointer;color:inherit}.app{display:grid;grid-template-columns:310px minmax(0,1fr);height:100dvh;min-height:590px}.rail{background:#fffef9;border-right:1px solid #dce7da;padding:26px 22px;display:flex;flex-direction:column;z-index:2}.brand{display:flex;gap:12px;align-items:center}.brand-icon{width:42px;height:42px;border-radius:14px;background:var(--green);color:white;display:grid;place-items:center;font-size:22px}.brand h1{font-size:18px;margin:0}.brand p{font-size:11px;color:var(--muted);margin:5px 0 0}.summary{margin:22px 0 18px;color:#708177;font-size:13px;line-height:1.8}.stats{display:flex;gap:9px;margin-bottom:23px}.stat{padding:12px 14px;border:1px solid #e5ebdf;background:#f3f6ed;border-radius:15px;flex:1}.stat b{display:block;font-size:23px}.stat span{display:block;font-size:11px;color:#829080;margin-top:2px}.head{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:600}.badge{font-size:10px;font-weight:400;background:#f8efda;color:#88724e;border-radius:12px;padding:5px 8px}.list{flex:1;overflow:auto;margin-top:10px}.row{display:block;width:100%;text-align:left;border:1px solid #e4ebdf;background:#f6f8f1;border-radius:13px;padding:12px;margin-bottom:8px}.row:hover{border-color:#c9d9c7}.row b{display:block;font-size:13px}.row span{display:block;color:#839083;font-size:11px;margin-top:4px}.empty{margin-top:6px;padding:20px 14px;border:1px dashed #d0dccb;border-radius:16px;color:#7f8d7e;font-size:12px;line-height:1.9}.foot{border-top:1px solid #e8ede3;padding-top:13px;font-size:10px;color:#879485;line-height:1.7}.map-shell{position:relative;overflow:hidden;background:#e9f1e9}.map{width:100%;height:100%;display:block;touch-action:none;cursor:grab}.map.dragging{cursor:grabbing}.world-bg{fill:#cdddc1;stroke:#edf2e9;stroke-width:.55;stroke-linejoin:round;fill-rule:evenodd;cursor:pointer;transition:fill .2s,filter .2s}.world-bg:hover{fill:#b8d1a8}.region{fill:#cdddc1;stroke:#edf2e9;stroke-width:.8;stroke-linejoin:round;fill-rule:evenodd;cursor:pointer;transition:fill .2s,filter .2s}.region:hover{fill:#b8d1a8}.lit{fill:var(--gold)!important;filter:drop-shadow(0 0 3px #edae39) drop-shadow(0 0 8px #f7db7c)}.map-top{position:absolute;inset:18px 20px auto;display:flex;justify-content:space-between;gap:10px;pointer-events:none}.caption,.status{pointer-events:auto;background:#fffff2e8;border:1px solid #dfe8da;box-shadow:0 4px 18px #33503d0c;border-radius:14px;padding:10px 13px}.caption b{font-size:13px;display:block}.caption small{font-size:10px;color:#849081;display:block;margin-top:3px}.status{font-size:10px;color:#758575;border-radius:22px;padding:9px 12px}.controls{position:absolute;right:17px;bottom:51px;display:grid;gap:7px}.control{width:39px;height:39px;border-radius:12px;border:1px solid #dce6d8;background:#fffef8;box-shadow:0 3px 10px #385a3710;font-size:20px}.control:hover,.secondary:hover{background:#f1f6eb}.map-footer{position:absolute;left:20px;bottom:16px;font-size:10px;color:#7f9080;pointer-events:none}.map-footer a{color:inherit;pointer-events:auto}.search{pointer-events:auto;display:flex;gap:5px}.search input{width:min(24vw,230px);border:1px solid #dce6d8;border-radius:12px;padding:9px 11px;background:#fffef8;font-size:12px;outline-color:#a8c49c}.search button{border:1px solid #dce6d8;background:#fffef8;border-radius:11px;padding:0 11px;font-size:11px}.crumb{position:absolute;left:20px;top:87px;background:#fffff2e8;border:1px solid #dfe8da;border-radius:12px;padding:8px 11px;font-size:11px;display:flex;align-items:center;gap:6px}.crumb button{border:0;background:none;color:#477362;padding:0}.crumb span{color:#91a092}.detail{position:absolute;top:18px;right:18px;bottom:52px;width:350px;max-width:calc(100% - 36px);overflow:auto;border:1px solid #dce7d8;border-radius:20px;background:#fffefb;box-shadow:0 14px 42px #34543d26;padding:20px;z-index:3}.detail[hidden]{display:none}.close{float:right;border:0;border-radius:50%;width:30px;height:30px;background:#eff3e9;font-size:19px}.detail h2{font-size:20px;margin:5px 0 6px}.sub{font-size:11px;color:#889586;margin-bottom:15px}.field{margin:13px 0}.field label{font-size:11px;color:#718175;display:block;margin-bottom:6px}.field input,.field textarea{width:100%;border:1px solid #dfe7da;border-radius:10px;background:#fff;padding:10px;font-size:12px;color:#314d42}.field textarea{resize:vertical;min-height:75px;line-height:1.65}.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:8px}.photo{position:relative}.photo img{display:block;width:100%;height:80px;object-fit:cover;border-radius:9px;background:#edf1e8}.photo button{position:absolute;right:4px;top:4px;width:20px;height:20px;border:0;border-radius:50%;background:#fffdf0e8;color:#774d3b;font-size:14px}.actions{display:flex;gap:8px;margin-top:18px}.actions button{border:0;border-radius:10px;padding:10px 12px;font-size:12px}.save{background:var(--green);color:white;flex:1}.secondary{background:#edf2e8}.delete{background:#faeeea;color:#94594c}dialog{border:1px solid #dce5d5;border-radius:20px;padding:24px;width:380px;max-width:calc(100% - 30px);background:#fffef9;color:#36533f}dialog::backdrop{background:#25413455;backdrop-filter:blur(3px)}dialog h2{font-size:18px;margin:0 0 12px}dialog p{font-size:12px;color:#738276;line-height:1.8}.hint{font-size:10px;color:#809080;line-height:1.7;margin-top:8px}.toast{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);background:#365e4d;color:white;border-radius:22px;padding:9px 14px;font-size:11px;z-index:7;box-shadow:0 5px 20px #233c3240;opacity:0;pointer-events:none;transition:opacity .2s}.toast.show{opacity:1}
@media(max-width:720px){.app{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr);min-height:100dvh;height:100dvh}.rail{padding:13px 16px 7px;border:0;border-bottom:1px solid #dce7da}.brand-icon{width:34px;height:34px;border-radius:11px;font-size:18px}.brand h1{font-size:15px}.brand p,.summary,.stats,.head,.foot{display:none}.list{flex:none;display:flex;gap:7px;max-height:54px;overflow:auto;margin-top:3px}.row{width:auto;flex:none;padding:7px 10px;margin:0}.row b{font-size:11px}.row span{font-size:9px;margin-top:2px}.empty{display:none}.map-top{inset:12px 10px auto;gap:6px}.caption{padding:8px 9px}.caption b{font-size:11px}.caption small{font-size:9px}.search input{width:31vw;padding:8px;font-size:10px}.search button{font-size:10px;padding:0 8px}.status{display:none}.crumb{left:10px;top:58px;padding:6px 8px;font-size:10px}.controls{right:11px;bottom:43px}.control{width:35px;height:35px}.map-footer{left:11px;bottom:12px;font-size:9px}.detail{inset:10px 10px 42px;width:auto;max-width:none;padding:17px}.photo img{height:90px}}

<body><div class="app"><aside class="rail"><header class="brand"><div class="brand-icon" aria-hidden="true">♡</div><div><h1>我们的旅行地图</h1><p>一家人，一路上的小美好</p></div></header><p class="summary">走过的地方会在地图上亮起，<br>每个标记都收着一段共同的回忆。</p><div class="stats"><div class="stat"><b id="placeCount">0</b><span>点亮的地方</span></div><div class="stat"><b id="photoCount">0</b><span>珍藏照片</span></div></div><div class="head"><span>我们的足迹</span><span class="badge" id="listTag">等待第一段旅程</span></div><div class="list" id="placeList"><div class="empty">🌱 给回忆留一个位置<br>在地图上选择去过的区域，<br>保存旅行故事，它就会亮起来。</div></div><footer class="foot">本设备保存 · 照片和记录不会上传到网站<br>全家跨设备同步需要另接共享数据服务。</footer></aside><main class="map-shell"><svg class="map" id="map" viewBox="0 0 1000 500" role="application" tabindex="0" aria-label="可拖动缩放并选择地区的旅行地图"><g id="shapes"></g><g id="markers"></g></svg><div class="map-top"><div class="caption"><b id="mapTitle">世界旅行地图</b><small id="mapHelp">点选国家 · 拖动 · 滚轮或双指缩放</small></div><form class="search" id="searchForm"><input id="searchInput" placeholder="搜索已载入的地区" aria-label="搜索已载入的地区"><button type="submit">查找</button></form><div class="status" id="status">正在准备地图…</div></div><nav class="crumb" id="crumb" hidden aria-label="地图层级"></nav><div class="controls"><button class="control" id="zoomIn" aria-label="放大地图">＋</button><button class="control" id="zoomOut" aria-label="缩小地图">−</button><button class="control" id="backWorld" aria-label="返回世界地图">⌂</button></div><footer class="map-footer">黄色区域 = 已记录 · 地图数据：<a href="https://www.naturalearthdata.com/" target="_blank" rel="noopener noreferrer">Natural Earth</a></footer><section class="detail" id="detail" hidden aria-label="旅行记录编辑"><button class="close" id="closeDetail" aria-label="关闭">×</button><h2 id="detailName"></h2><div class="sub" id="detailSub"></div><div class="field"><label for="date">旅行日期</label><input id="date" type="date"></div><div class="field"><label for="intro">地区简介</label><textarea id="intro" placeholder="这里有什么特别之处？"></textarea></div><div class="field"><label for="memory">旅行回忆</label><textarea id="memory" placeholder="记下这一趟的故事…"></textarea></div><div class="field"><label for="photoFiles">旅行照片（可多选）</label><input id="photoFiles" type="file" accept="image/*" multiple><div class="photos" id="photos"></div><div class="hint">照片保存在这台设备的浏览器中，不会公开到网站。建议单张不超过 8 MB。</div></div><div class="actions"><button class="save" id="save">保存并点亮</button><button class="delete" id="delete" hidden>删除记录</button></div></section><div id="toast" class="toast" role="status"></div></main></div>
<dialog id="errorDialog"><h2>地图暂时没能载入</h2><p id="errorText">请检查网络连接后刷新。</p><button class="save" id="closeError">知道了</button></dialog>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id), svgNS='http://www.w3.org/2000/svg', map=$('map'), shapes=$('shapes'), dbName='family-travel-map-v2';
const view={x:0,y:0,w:1000,h:500}, state={level:'world',trail:[],features:[],selected:null,records:new Map(),photoDraft:[],pendingFiles:[],dataSource:null};
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function drawView(){map.setAttribute('viewBox',`${view.x} ${view.y} ${view.w} ${view.h}`)}
function zoom(factor,anchor){let old=view.w,width=Math.max(35,Math.min(1500,old*factor));factor=width/old;let p=anchor||{x:view.x+view.w/2,y:view.y+view.h/2};view.x=p.x-(p.x-view.x)*factor;view.y=p.y-(p.y-view.y)*factor;view.w=width;view.h*=factor;drawView()}
function projection([lng,lat]){return [(lng+180)*1000/360,(90-lat)*500/180]}
function pathForGeometry(g){let out='',pts=[];function ring(coords){for(let i=0;i<coords.length;i++){let p=projection(coords[i]);pts.push(p);out+=(i?'L':'M')+p[0].toFixed(2)+','+p[1].toFixed(2)}out+='Z'}if(g.type==='Polygon')g.coordinates.forEach(ring);else if(g.type==='MultiPolygon')g.coordinates.forEach(poly=>poly.forEach(ring));return{d:out,pts}}
function bounds(features){let xs=[],ys=[];for(let f of features){if(!f.geometry)continue;let p=pathForGeometry(f.geometry).pts;for(let q of p){xs.push(q[0]);ys.push(q[1])}}if(!xs.length)return null;let x=Math.min(...xs),y=Math.min(...ys),w=Math.max(...xs)-x,h=Math.max(...ys)-y,pad=Math.max(w,h)*.09+3;return{x:x-pad,y:y-pad,w:w+pad*2,h:h+pad*2}}
function fit(features){let b=bounds(features);if(b){Object.assign(view,b);drawView()}}
function keyOf(f){let p=f.properties||{};return p._key||p.adcode||p.iso_3166_2||p.ADM0_A3||p.adm0_a3||p.name}
function nameOf(f){let p=f.properties||{};return p.name||p.NAME_ZH||p.NAME||p.ADMIN||p.admin||p.name_zh||p.NAME_EN||keyOf(f)}
function addShape(f,klass='region'){if(!f.geometry&&!f.path)return;let path=document.createElementNS(svgNS,'path');path.setAttribute('d',f.path||pathForGeometry(f.geometry).d);path.setAttribute('class',klass);let key=String(keyOf(f));path.dataset.key=key;path.setAttribute('aria-label',nameOf(f));path.setAttribute('tabindex','0');path.setAttribute('role','button');if(state.records.has(key))path.classList.add('lit');path.addEventListener('click',()=>selectFeature(f));path.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();selectFeature(f)}});shapes.append(path)}
function render(){shapes.replaceChildren();$('markers').replaceChildren();state.features.forEach(f=>addShape(f,state.level==='world'?'world-bg':'region'));for(let r of state.records.values()){if(r.lat!=null&&r.lng!=null&&r.level==='city'){let g=document.createElementNS(svgNS,'g');g.setAttribute('transform',`translate(${projection([r.lng,r.lat]).join(',')})`);g.innerHTML='<circle r="4.2" fill="#fff9d8" stroke="#a9751a" stroke-width="1.5"/><circle r="1.8" fill="#d79e22"/>';g.style.pointerEvents='none';$('markers').append(g)}}renderList();renderCrumb();$('mapTitle').textContent=state.trail.length?state.trail.at(-1).name:'世界旅行地图';$('mapHelp').textContent=state.level==='world'?'点选国家 · 拖动 · 滚轮或双指缩放':'选择区域记录旅行 · 点面包屑返回上层';$('status').textContent=state.level==='world'?'点亮你们去过的地方':`${state.features.length} 个地区`}
function renderList(){let list=$('placeList');list.replaceChildren();$('placeCount').textContent=state.records.size;let photos=0;for(let r of state.records.values())photos+=r.photos?.length||0;$('photoCount').textContent=photos;$('listTag').textContent=state.records.size?`${state.records.size} 个足迹`:'等待第一段旅程';if(!state.records.size){let e=document.createElement('div');e.className='empty';e.textContent='🌱 给回忆留一个位置　在地图上选择去过的区域，保存旅行故事，它就会亮起来。';list.append(e);return}for(let r of [...state.records.values()].sort((a,b)=>(b.date||'').localeCompare(a.date||''))){let b=document.createElement('button');b.className='row';let title=document.createElement('b'),sub=document.createElement('span');title.textContent=r.name;sub.textContent=[r.date||'日期待补充',r.photos?.length?`${r.photos.length} 张照片`:null].filter(Boolean).join(' · ');b.append(title,sub);b.onclick=()=>openRecord(r);list.append(b)}}
function renderCrumb(){let c=$('crumb');c.replaceChildren();c.hidden=!state.trail.length;state.trail.forEach((item,i)=>{if(i){let sep=document.createElement('span');sep.textContent='›';c.append(sep)}let b=document.createElement('button');b.textContent=item.name;b.onclick=()=>restoreLevel(i);c.append(b)})}
async function initDB(){return new Promise((resolve,reject)=>{let req=indexedDB.open(dbName,1);req.onupgradeneeded=()=>req.result.createObjectStore('records',{keyPath:'id'});req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
let db;async function readAll(){return new Promise((resolve,reject)=>{let req=db.transaction('records').objectStore('records').getAll();req.onsuccess=()=>resolve(req.result||[]);req.onerror=()=>reject(req.error)})}async function putRecord(r){return new Promise((resolve,reject)=>{let tx=db.transaction('records','readwrite');tx.objectStore('records').put(r);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}async function removeRecord(id){return new Promise((resolve,reject)=>{let tx=db.transaction('records','readwrite');tx.objectStore('records').delete(id);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}
function toast(s){let t=$('toast');t.textContent=s;t.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove('show'),2400)}
function featureId(f){return String(keyOf(f))}function selectFeature(f){let p=f.properties||{},level=state.level,id=featureId(f),name=nameOf(f);if(level==='world'&&id==='CHN'){loadChina(f);return}if(level==='world'&&(id==='USA'||id==='AUS')){loadStates(id,f);return}if((level==='province'||level==='city')&&p.childrenNum>0&&p.level!=='district'){loadChina(f);return}let crumb=state.trail.map(x=>x.name).join(' · '),record=state.records.get(id);state.selected={id,name,level,parents:crumb,feature:f};openEditor(record)}
async function loadGeo(url){let res=await fetch(url);if(!res.ok)throw Error(`地图数据加载失败（${res.status}）`);let d=await res.json();if(!Array.isArray(d.features))throw Error('地图数据格式无法识别');return d.features.filter(f=>f.geometry&&f.geometry.type&&f.properties)}
async function loadChina(parent){let p=parent.properties||{},code=String(p.adcode||'100000'),name=nameOf(parent);try{toast('正在打开中国行政区…');let feats=await loadGeo(`https://geo.datav.aliyun.com/areas_v3/bound/${code}_full.json`);if(!feats.length)throw Error('这个地区暂时没有下一级边界数据');let first=feats.find(f=>f.properties.level);let level=first?.properties.level||'district';state.trail.push({name,returnLevel:state.level,returnFeatures:state.features,returnView:{...view}});state.level=level==='province'?'province':level==='city'?'city':'district';state.features=feats.map(f=>({...f,properties:{...f.properties,_key:String(f.properties.adcode)}}));$('mapTitle').textContent=name;fit(state.features);render();toast('可继续点选省、市或区县')}catch(e){showError(e.message+'。请稍后再试。')}}
async function loadStates(country,parent){try{toast('正在载入州／省地图…');let data=await loadGeo('https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_50m_admin_1_states_provinces.geojson');let code=country==='USA'?'US-':'AU-';let feats=data.filter(f=>{let p=f.properties||{},iso=String(p.iso_3166_2||'');if(country==='USA')return iso.startsWith(code)&&!iso.includes('~');return iso.startsWith(code)&&!iso.includes('~')&&!iso.endsWith('X02')});if(country==='AUS')feats=feats.filter(f=>{let iso=f.properties.iso_3166_2;return ['AU-NSW','AU-QLD','AU-SA','AU-TAS','AU-VIC','AU-WA','AU-NT','AU-ACT'].includes(iso)});feats=feats.map(f=>({...f,properties:{...f.properties,_key:f.properties.iso_3166_2,name:f.properties.name||f.properties.name_en||f.properties.NAME}}));state.trail.push({name:nameOf(parent),returnLevel:'world',returnFeatures:worldFeatures,returnView:{x:0,y:0,w:1000,h:500}});state.level='state';state.features=feats;fit(feats);render();toast('点选州／省，填写旅行故事')}catch(e){showError('州／省边界载入失败。请检查网络后再试。')}}
function restoreLevel(i){let target=state.trail[i];if(!target){state.trail=[];state.level='world';state.features=worldFeatures;Object.assign(view,{x:0,y:0,w:1000,h:500})}else{state.trail=state.trail.slice(0,i);state.level=target.returnLevel;state.features=target.returnFeatures;Object.assign(view,target.returnView)}drawView();render()}
function openEditor(r){let s=state.selected;if(!s)return;state.photoDraft=(r?.photos||[]).map(p=>({...p}));state.pendingFiles=[];$('detailName').textContent=r?.name||s.name;$('detailSub').textContent=[s.parents||'',s.level==='district'?'中国区县':s.level==='state'?'州／省':s.level==='country'?'国家':s.level==='city'?'城市':'地区'].filter(Boolean).join(' · ');$('date').value=r?.date||'';$('intro').value=r?.intro||'';$('memory').value=r?.memory||'';$('delete').hidden=!r;$('detail').hidden=false;renderPhotos()}
function openRecord(r){state.selected={id:r.id,name:r.name,level:r.level,parents:r.parents||'',feature:null};openEditor(r)}function renderPhotos(){let box=$('photos');box.replaceChildren();state.photoDraft.forEach((p,i)=>{let wrap=document.createElement('div');wrap.className='photo';let img=document.createElement('img');img.src=URL.createObjectURL(p.blob);img.alt=`旅行照片 ${i+1}`;let del=document.createElement('button');del.type='button';del.textContent='×';del.setAttribute('aria-label','移除此照片');del.onclick=()=>{state.photoDraft.splice(i,1);renderPhotos()};wrap.append(img,del);box.append(wrap)})}
$('photoFiles').onchange=e=>{for(let f of e.target.files){if(!f.type.startsWith('image/'))continue;if(f.size>8*1024*1024){toast('单张照片请控制在 8 MB 以内');continue}state.photoDraft.push({name:f.name,type:f.type,blob:f})}e.target.value='';renderPhotos()};$('save').onclick=async()=>{let s=state.selected;if(!s)return;try{let r={id:s.id,name:s.name,level:s.level,parents:s.parents,date:$('date').value,intro:$('intro').value.trim(),memory:$('memory').value.trim(),photos:state.photoDraft,lat:s.feature?.properties?.latitude||s.feature?.properties?.lat||null,lng:s.feature?.properties?.longitude||s.feature?.properties?.lon||null};await putRecord(r);state.records.set(r.id,r);$('detail').hidden=true;render();toast('保存好了，这个地方亮起来了 ✨')}catch(e){toast('保存失败：浏览器存储空间可能不足')}};$('delete').onclick=async()=>{let id=state.selected?.id;if(!id)return;if(!confirm('删除这条旅行记录和它的照片？此操作无法撤销。'))return;await removeRecord(id);state.records.delete(id);$('detail').hidden=true;render();toast('记录已删除，区域熄灭了')};$('closeDetail').onclick=()=>$('detail').hidden=true;
function showError(s){$('errorText').textContent=s;$('errorDialog').showModal()}$('closeError').onclick=()=>$('errorDialog').close();
let worldFeatures=[];async function initWorld(){try{let response=await fetch('./world.svg');if(!response.ok)throw Error('世界地图没有载入');let doc=new DOMParser().parseFromString(await response.text(),'image/svg+xml');let src=[...doc.querySelectorAll('path')];if(!src.length)throw Error('世界地图数据为空');worldFeatures=src.map(p=>({type:'Feature',properties:{_key:p.dataset.country||p.id,name:p.dataset.name||p.getAttribute('aria-label')||p.dataset.country||p.id},geometry:null,path:p.getAttribute('d')}));shapes.replaceChildren();for(let f of worldFeatures){let path=document.createElementNS(svgNS,'path');path.setAttribute('d',f.path);path.setAttribute('class','world-bg');path.dataset.key=featureId(f);path.setAttribute('tabindex','0');path.setAttribute('role','button');path.setAttribute('aria-label',nameOf(f));if(state.records.has(featureId(f)))path.classList.add('lit');path.onclick=()=>selectFeature(f);path.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();selectFeature(f)}};shapes.append(path)}state.features=worldFeatures;renderList();renderCrumb();$('status').textContent='点选国家开始记录'}catch(e){showError('世界地图暂时没能载入。请检查网络后刷新。')}}
function findLoaded(q){q=q.trim().toLocaleLowerCase();if(!q)return;let match=state.features.find(f=>nameOf(f).toLocaleLowerCase().includes(q)||featureId(f).toLocaleLowerCase()===q);if(!match){toast('没有找到已载入的地区；请先进入国家或省份');return}let el=[...shapes.querySelectorAll('[data-key]')].find(x=>x.dataset.key===featureId(match));if(el){el.focus();selectFeature(match)}}$('searchForm').onsubmit=e=>{e.preventDefault();findLoaded($('searchInput').value)};
const ptrs=new Map();map.addEventListener('wheel',e=>{e.preventDefault();let p=new DOMPoint(e.clientX,e.clientY).matrixTransform(map.getScreenCTM().inverse());zoom(Math.exp(Math.max(-100,Math.min(100,e.deltaY))*.002),p)},{passive:false});map.addEventListener('pointerdown',e=>{if(e.target.closest('.world-bg,.region'))return;ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});map.setPointerCapture(e.pointerId);map.classList.add('dragging')});map.addEventListener('pointermove',e=>{let old=ptrs.get(e.pointerId);if(!old)return;ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});if(ptrs.size===2){let a=[...ptrs.values()],dist=v=>Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y);let before=[old,...a.filter(p=>p!==ptrs.get(e.pointerId))];if(dist(a)>0)zoom(dist(before)/dist(a))}else{let m=map.getScreenCTM();view.x-=(e.clientX-old.x)/m.a;view.y-=(e.clientY-old.y)/m.d;drawView()}});for(let t of ['pointerup','pointercancel','lostpointercapture'])map.addEventListener(t,e=>{ptrs.delete(e.pointerId);if(!ptrs.size)map.classList.remove('dragging')});$('zoomIn').onclick=()=>zoom(.75);$('zoomOut').onclick=()=>zoom(1/.75);$('backWorld').onclick=()=>restoreLevel(-1);map.onkeydown=e=>{if(e.key==='+'||e.key==='=')zoom(.75);if(e.key==='-')zoom(1/.75)};document.addEventListener('keydown',e=>{if(e.key==='Escape')$('detail').hidden=true});
(async()=>{try{db=await initDB();for(let r of await readAll())state.records.set(r.id,r);await initWorld();render()}catch(e){showError('本机保存暂不可用。请使用新版 Chrome、Edge 或 Safari。')}})();
})();
