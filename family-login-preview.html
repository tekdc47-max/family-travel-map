  <style>
    .leaflet-interactive.region-lit{filter:drop-shadow(0 0 3px #dfa536b0)}

      body:not(.leaflet-dragging) #map path.leaflet-interactive:hover{fill:#bfe4d8}

    .app{grid-template-columns:300px minmax(0,1fr)}
    .rail{background:#fff;padding:28px 22px 20px;border-color:var(--line)}
    .brand{margin-bottom:28px}.brand h1{font-size:20px;letter-spacing:-.6px}.brand p{margin-top:6px}
    .brand-mark{background:var(--accent);border-radius:13px;box-shadow:none}
    .search{background:#f5f9f8;border-color:transparent;height:48px;border-radius:12px;font-size:16px}

    .rail-foot{padding-top:17px;line-height:1.8}.map-shell,.leaflet-container{background:#eaf2f6}

<body>
  <main class="app" id="cloudMap" style="visibility:hidden" inert>
    <aside class="rail" aria-label="旅行地点">
      <div class="brand"><div class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M12 21s7-5.6 7-12A7 7 0 1 0 5 9c0 6.4 7 12 7 12Z" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="9" r="2.5" fill="currentColor"/></svg></div><div><h1>我们的旅行地图</h1><p>把一起走过的路，留在这里</p></div></div>
      <div class="search-wrap"><span class="search-icon" aria-hidden="true">⌕</span><input id="search" class="search" placeholder="搜索城市或地区" autocomplete="off" aria-label="搜索城市或地区"><div id="searchResults" class="search-results" role="group" aria-label="搜索结果"></div></div>
      <div class="section-head"><h2>旅行足迹</h2><div class="rail-tools"><span id="placeCount" class="count">0 个地点</span><button id="accountAdminOpen" class="backup-link" hidden>账号管理</button><button id="cloudSignOut" class="backup-link">退出登录</button></div></div>
      <div id="placeList" class="place-list"><div class="empty-list">还没有旅行足迹。<br>搜索一座城市，或在地图上点一下，收藏你们一起去过的地方。</div></div>
      <div class="rail-foot" id="cloudRole">家庭共享 · 私密访问</div>
    </aside>
    <section class="map-shell" aria-label="世界旅行地图"><div id="map" class="map"></div>
      <div id="mapStatus" class="map-status">
        <p id="mapStatusText" role="status">正在加载地图…</p>
        <button id="mapRetry" class="save-btn" type="button" hidden>重试</button>
      </div>
      <div class="map-top"><div class="map-caption"><b>一家人的世界足迹</b><span id="mapCaption">每一枚标记，都是一段共同回忆</span></div><div class="map-actions"><button id="locateBtn" class="icon-btn" title="回到地图总览" aria-label="回到地图总览"><svg aria-hidden="true" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18"/></svg></button><button id="addBtn" class="pill-btn primary"><span aria-hidden="true">＋</span> <span id="addLabel">添加地点</span></button></div></div>
      <div class="map-hint">点地区平滑放大 · 点“添加地点”记录旅程</div>
    </section>
    <aside id="detailPanel" class="panel" aria-label="地点详情" aria-hidden="true"><div class="panel-head"><div><div class="eyebrow">FAMILY TRIP</div><h2 id="panelTitle">新地点</h2></div><button id="closePanel" class="panel-close" aria-label="关闭详情">×</button></div><div class="panel-body">
      <div class="field"><label for="placeName">地点名称</label><input id="placeName" maxlength="80" placeholder="例如：京都"></div>
      <div class="field"><label for="placeDate">旅行日期</label><input id="placeDate" type="date"></div>
      <div class="field"><label for="placeIntro">地区简介</label><textarea id="placeIntro" maxlength="400" placeholder="这座城市有什么特别之处？"></textarea></div>
      <div class="field"><label for="placeMemory">旅行回忆</label><textarea id="placeMemory" class="story" maxlength="3000" placeholder="写下那天的小事、喜欢的风景，或一句只有家人懂的话…"></textarea></div>
      <div class="field"><div class="photo-head">旅行照片 <span id="photoCount">0 张</span></div><div id="photoGrid" class="photo-grid"></div><input id="photoInput" type="file" accept="image/*" multiple hidden></div>
    </div><div class="panel-actions"><button id="savePlace" class="save-btn">保存地点</button><button id="deletePlace" class="delete-btn">删除</button></div></aside>
  </main>
  <dialog id="addModal" class="modal" aria-labelledby="modalTitle"><h2 id="modalTitle">添加旅行地点</h2><p id="modalCoords">在地图上选中的位置</p><div class="field"><label for="newName">地点名称</label><input id="newName" maxlength="80" placeholder="例如：东京" autofocus></div><div class="field"><label for="newDate">旅行日期（可稍后补充）</label><input id="newDate" type="date"></div><p id="addError" role="alert" hidden></p><div class="modal-actions"><button id="cancelAdd" class="cancel-btn">取消</button><button id="confirmAdd" class="save-btn">添加地点</button></div></dialog>
  
  <section id="cloudLogin" class="modal" aria-labelledby="cloudTitle" style="position:fixed;inset:0;margin:auto;width:min(420px,calc(100% - 32px));height:max-content;z-index:2100">
    <h2 id="cloudTitle">家庭旅行地图</h2>
    <p>使用管理员发给你的账号登录，查看一家人的旅行足迹。</p>
    <form id="familyPasswordLogin" method="post">
      <div class="field"><label for="familyUsername">用户名</label><input id="familyUsername" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="32" required></div>
      <div class="field"><label for="familyPassword">密码</label><input id="familyPassword" name="password" type="password" autocomplete="current-password" required></div>
      <button class="save-btn" type="submit" disabled>登录</button>
    </form>
    <details style="margin-top:16px">
      <summary>原有账号用邮箱登录</summary>
      <form id="familyEmailLogin" method="post">
        <div class="field"><label for="familyEmail">邮箱</label><input id="familyEmail" name="email" type="email" autocomplete="email" required></div>
        <button class="save-btn" type="submit" disabled>发送登录链接</button>
      </form>
    </details>
    <p role="status" aria-live="polite">正在检查登录状态…</p>
    <noscript>需要启用 JavaScript 才能登录。</noscript>
  </section>
  <dialog id="accountAdminDialog" class="modal" aria-labelledby="accountAdminTitle">
    <h2 id="accountAdminTitle">家庭账号管理</h2>
    <p id="accountAdminCount">正在读取账号…</p>
    <div id="accountAdminList" aria-label="共享账号列表"></div>
    <p>已有密码不可查看。选中账号后可设置至少 6 位的新密码。</p>
    <div class="field"><label for="accountAdminTarget">共享成员</label><select id="accountAdminTarget"></select></div>
    <form id="accountAdminForm" method="post" autocomplete="off" hidden>
      <div class="field" data-account-role><label for="accountAdminRole">地图权限</label>
        <select id="accountAdminRole" name="role"><option value="viewer">仅观看</option><option value="editor">可编辑</option></select>
      </div>
      <div data-account-credentials>
        <div class="field"><label for="accountAdminUsername">用户名</label>
          <input id="accountAdminUsername" name="username" maxlength="32" autocapitalize="none" spellcheck="false">

    map.flyTo(point, Math.max(map.getZoom(), 9), motion());
    $("#mapCaption").textContent = `${name} · 可记录到这里`;
  };
  document.addEventListener("click", (e) => {
    if (!e.target.closest(".search-wrap")) $("#searchResults").classList.remove("show");
  });
  $("#search").onkeydown = (e) => {
    if (e.key === "Escape") $("#searchResults").classList.remove("show");
    if (e.key === "Enter") $("#searchResults").querySelector("[data-result]")?.click();
  };
  let refreshing = false, refreshAgain = false, syncFailed = false;
  async function refreshCloud(immediate = false) {
    if (document.hidden || navigator.onLine === false || cloud.pendingWrites) return;
    if (refreshing) { refreshAgain ||= immediate; return; }
    refreshing = true;
    const version = cloud.writeVersion, focus = selectedId;
    try {
      const next = await allPlaces();
      if (cloud.writeVersion !== version || selectedId !== focus) {
        refreshAgain = true;
        return;
      }
      syncFailed = false;
      const previous = new Map(places.map(p => [p.id, p]));
      if (next.length === previous.size && next.every(p => JSON.stringify(p) === JSON.stringify(previous.get(p.id)))) return;
      places = next;
      if (focus && !next.some(p => p.id === focus)) {
        if (!hasUnsavedDetails()) { closePanel(true); return; }
        if (previous.has(focus)) notify('此地点已在其他设备删除，当前输入暂时保留。', true);
      }
      render(true);
    } catch {
      if (!syncFailed) notify('共享地图暂时无法同步，连接恢复后会重试。', true);
      syncFailed = true;
    } finally {
      refreshing = false;
      if (refreshAgain) { refreshAgain = false; refreshCloud(true); }
    }
  }
  const syncNow = () => refreshCloud(true);
  syncNow();
  try { cloud.watch(syncNow); } catch {}
  setInterval(refreshCloud, 6000);
  addEventListener('focus', syncNow);
  addEventListener('online', syncNow);
  document.addEventListener('visibilitychange', syncNow);
})();
  }
  </script>
</body>
</html>
